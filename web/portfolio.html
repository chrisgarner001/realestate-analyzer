<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Owned Properties · PropYield</title>
<link rel="icon" type="image/png" href="/public/propyield_icon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --navy: #223149; --navy-deep: #142235; --navy-mid: #2d405b;
    --navy-light: #3b526f; --green: #2d9b58; --green-light: #4bc477;
    --gold: #d8a83d; --gold-light: #f0c45b; --text: #f1f5f9;
    --muted: #b0bfd0; --border: #405671; --red: #f87171;
  }
  * { box-sizing: border-box; }
  body { background: var(--navy-deep); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
  .card { background: var(--navy); border: 1px solid var(--border); }
  .muted { color: var(--muted); }
  input, select, textarea { background: var(--navy-mid); border: 1px solid var(--border); color: var(--text); border-radius: .5rem; padding: .45rem .6rem; font-size: 14px !important; line-height: 1.3; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); }
  .btn { background: var(--navy-mid); color: var(--text); border-radius: .5rem; padding: .45rem .8rem; font-size: .8rem; font-weight: 600; }
  .btn:hover { background: var(--navy-light); }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-light); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .chip { display: inline-block; font-size: .68rem; font-weight: 600; padding: .1rem .45rem; border-radius: 9999px; background: var(--navy-mid); color: var(--muted); margin: 1px; white-space: nowrap; }
  .chip-gold { color: var(--gold-light); } .chip-red { color: #fca5a5; } .chip-green { color: #86efac; }
  .exit-badge { display: inline-block; font-size: .75rem; font-weight: 600; padding: .12rem .55rem; border-radius: 9999px; background: var(--navy-mid); color: var(--text); white-space: nowrap; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: .8rem; }
  table.tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: .45rem .5rem; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--navy); position: sticky; top: 0; }
  table.tbl td { padding: .45rem .5rem; border-bottom: 1px solid rgba(64,86,113,.5); vertical-align: top; }
  table.tbl tr.clickable:hover td { background: rgba(255,255,255,.03); cursor: pointer; }
  table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sticky-col { position: sticky; left: 0; background: var(--navy); z-index: 1; }
  .rec-col { outline: 1px solid var(--gold-light); outline-offset: -1px; }
  .dq { opacity: .45; }
  .prose-report h1,.prose-report h2,.prose-report h3 { color: var(--gold-light); font-weight: 600; margin: 1rem 0 .4rem; }
  .prose-report p { margin-bottom: .7rem; line-height: 1.65; color: #cbd5e1; }
  .prose-report ul,.prose-report ol { margin: .4rem 0 .7rem 1.2rem; list-style: disc; color: #cbd5e1; }
  .prose-report strong { color: var(--text); }
  .drop { border: 2px dashed var(--border); }
  .drop.over { border-color: var(--green); background: rgba(45,155,88,.06); }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [x-cloak] { display: none !important; }
  .status-icon { animation: statusPulse 1.8s ease-in-out infinite; }
  @keyframes statusPulse { 0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(45,138,78,.28)} 50%{transform:scale(1.05);box-shadow:0 0 0 10px rgba(45,138,78,0)} }
  .status-progress { animation: statusProgress 14s ease-in-out infinite; }
  @keyframes statusProgress { 0%{width:12%} 35%{width:42%} 65%{width:68%} 100%{width:88%} }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(28rem, 100vw); z-index: 70; overflow-y: auto; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; }
  label.f { display: block; font-size: .72rem; color: var(--muted); margin-bottom: .2rem; }
  .help { font-size: .68rem; color: var(--muted); margin-top: .15rem; }
</style>
</head>
<body x-data="portfolio()" x-init="init()">
<div class="sr-only" aria-live="polite" x-text="liveMessage"></div>

<header class="card border-x-0 border-t-0 px-4 sm:px-6 py-3 flex items-center justify-between sticky top-0 z-50">
  <div class="flex items-center gap-3 min-w-0">
    <a :href="'/'+slug" class="btn" aria-label="Back to analyzer">← Analyzer</a>
    <div class="min-w-0">
      <p class="font-semibold truncate">Owned properties</p>
      <p class="text-xs muted truncate" x-text="tenantName"></p>
    </div>
  </div>
  <div class="flex items-center gap-2 text-xs">
    <span class="chip" x-show="me" x-text="free ? 'Free during testing' : isSuper ? 'Unlimited tokens' : ('Balance ' + (me ? me.token_balance : 0) + ' tokens')"></span>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">
  <div x-show="error" x-cloak class="rounded-lg px-4 py-3 text-sm" style="background:rgba(239,68,68,.1);color:var(--red)" x-text="error"></div>

  <!-- ─────────────── HOME: upload + single + batch list ─────────────── -->
  <template x-if="view==='home'">
    <div class="space-y-6">
      <div class="flex gap-2">
        <button class="btn" :class="homeTab==='upload'&&'btn-primary'" @click="homeTab='upload'">Upload inventory</button>
        <button class="btn" :class="homeTab==='single'&&'btn-primary'" @click="homeTab='single'">Single property</button>
      </div>

      <section x-show="homeTab==='upload'" class="card rounded-xl p-5 space-y-4">
        <div>
          <h2 class="font-semibold">Upload your inventory export</h2>
          <p class="text-sm muted">Get a recommended exit for every property: sell as-is, rehab &amp; sell, rehab &amp; rent, or land contract. CSV or Excel, up to 500 rows and 2 MB.</p>
        </div>
        <button type="button" class="drop w-full rounded-xl p-8 text-center" :class="dragOver&&'over'"
          @click="$refs.inv.click()" @dragover.prevent="dragOver=true" @dragleave="dragOver=false"
          @drop.prevent="dragOver=false; pickInventory($event.dataTransfer.files[0])" aria-label="Choose an inventory file">
          <p class="font-medium" x-text="invFile ? invFile.name : 'Drop the inventory CSV or Excel file here, or click to choose'"></p>
          <p class="text-xs muted mt-1">Required columns: Building Name, Building City, Status, Marketing: Comps, Rehab: Rehab Quote Amount, property tax columns</p>
        </button>
        <input x-ref="inv" type="file" class="hidden" accept=".csv,.xlsx,.xls" @change="pickInventory($event.target.files[0]); $event.target.value=''">
        <div class="flex flex-wrap items-center gap-3 text-sm">
          <button class="btn" @click="$refs.loans.click()">+ Loans file (optional)</button>
          <input x-ref="loans" type="file" class="hidden" accept=".csv,.xlsx,.xls" @change="pickLoans($event.target.files[0]); $event.target.value=''">
          <span class="muted text-xs" x-text="loansFile ? loansFile.name + ' · matched by address' : 'Columns: Building Name, Building City, Loan Payoff, Loan Rate, Loan P&I'"></span>
          <button x-show="loansFile" class="text-xs muted underline" @click="loansFile=null">remove</button>
        </div>
        <div x-show="uploadError" class="text-sm" style="color:var(--red)">
          <p x-text="uploadError"></p>
          <p x-show="uploadMissing.length" class="text-xs mt-1">Missing columns: <span x-text="uploadMissing.join(', ')"></span></p>
        </div>
        <button class="btn btn-primary" :disabled="!invFile||uploading" @click="upload()" x-text="uploading ? 'Reading file…' : 'Preview properties (free)'"></button>
      </section>

      <!-- Single property entry: a few owner-known numbers; everything else is looked up -->
      <section x-show="homeTab==='single' && singleBusy" x-cloak class="card rounded-xl p-5">
        <div class="py-8 sm:py-12 text-center" role="status" aria-live="polite">
          <div class="status-icon w-16 h-16 mx-auto rounded-2xl flex items-center justify-center" style="background:rgba(45,138,78,.16);color:var(--green)">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M12 3v3m0 12v3M3 12h3m12 0h3m-3.64-6.36l-2.12 2.12m-8.48 8.48l-2.12 2.12m0-12.72l2.12 2.12m8.48 8.48l2.12 2.12M9 9l6 6m0-6l-6 6"/>
            </svg>
          </div>
          <p class="mt-5 text-lg font-semibold" style="color:var(--text)" x-text="STATUSES[statusIndex].label"></p>
          <p class="mt-1 text-sm" style="color:var(--muted)" x-text="STATUSES[statusIndex].detail"></p>
          <div class="h-1.5 max-w-sm mx-auto mt-6 rounded-full overflow-hidden" style="background:var(--navy-mid)">
            <div class="status-progress h-full rounded-full" style="background:var(--green)"></div>
          </div>
          <p class="mt-3 text-xs" style="color:var(--muted)">Building your property report</p>
          <p class="mt-2 max-w-md mx-auto text-xs leading-relaxed" style="color:var(--muted)">This report may take up to 3 minutes to complete while we access the necessary data sources and compile the information. Keep this tab open.</p>
        </div>
      </section>
      <section x-show="homeTab==='single' && !singleBusy" class="card rounded-xl p-5 space-y-5">
        <div>
          <h2 class="font-semibold">Analyze one owned property</h2>
          <p class="text-sm muted">Enter what you know. We look up the current value, after-repair value, rent, sales and rent comps, days on market, property facts and property taxes, then compare selling as-is, rehab &amp; sell, rehab &amp; rent and land contract.</p>
        </div>
        <div>
          <label class="f" for="s-address">Property address *</label>
          <input id="s-address" class="w-full" x-model="single.address" placeholder="12345 Main St, Harper Woods, MI 48225" autocomplete="street-address">
        </div>
        <fieldset class="grid sm:grid-cols-3 gap-3">
          <legend class="text-xs font-semibold mb-2 sm:col-span-3" style="color:var(--gold-light)">Rehab &amp; loan</legend>
          <div><label class="f">Rehab estimate</label><input class="w-full" type="number" min="0" x-model="single.rehab_estimate" placeholder="$"><p class="help">Blank → estimated from condition notes</p></div>
          <div><label class="f">Loan balance</label><input class="w-full" type="number" min="0" x-model="single.loan_balance" placeholder="$"><p class="help">Payoff amount today. Blank = no loan</p></div>
          <div><label class="f" for="s-date-vacant">Date vacant</label><input id="s-date-vacant" class="w-full" type="date" x-model="single.date_vacant"><p class="help">Carrying cost since this date is added to your cost basis</p></div>
        </fieldset>
        <fieldset class="grid grid-cols-2 sm:grid-cols-6 gap-3">
          <legend class="text-xs font-semibold mb-2 col-span-2 sm:col-span-6" style="color:var(--gold-light)">Monthly holding costs</legend>
          <div><label class="f">Insurance</label><input class="w-full" type="number" min="0" x-model="single.insurance_monthly" placeholder="$100"></div>
          <div><label class="f">Utilities</label><input class="w-full" type="number" min="0" x-model="single.utilities_monthly" placeholder="$250"></div>
          <div><label class="f">Maintenance</label><input class="w-full" type="number" min="0" x-model="single.maintenance_monthly" placeholder="$100"></div>
          <div><label class="f">Security</label><input class="w-full" type="number" min="0" x-model="single.security_monthly" placeholder="$0"></div>
          <div><label class="f">Grass / snow</label><input class="w-full" type="number" min="0" x-model="single.grass_snow_monthly" placeholder="$0"></div>
          <div><label class="f">Other</label><input class="w-full" type="number" min="0" x-model="single.other_monthly" placeholder="$0"></div>
          <p class="help col-span-2 sm:col-span-6">Blank uses the amounts shown. Property tax is looked up from the millage database.</p>
        </fieldset>
        <fieldset class="grid sm:grid-cols-3 gap-3">
          <legend class="text-xs font-semibold mb-2 sm:col-span-3" style="color:var(--gold-light)">Basis &amp; exposure</legend>
          <div><label class="f">Current cost basis</label><input class="w-full" type="number" min="0" x-model="single.cost_basis" placeholder="$"><p class="help">Purchase + improvements (carrying cost since the vacant date is added)</p></div>
          <div><label class="f">Investor exposure</label><input class="w-full" type="number" min="0" x-model="single.investor_exposure" placeholder="$"><p class="help">Owed to investors at sale or LC payoff</p></div>
          <div><label class="f">Other owed at sale</label><input class="w-full" type="number" min="0" x-model="single.other_owed_at_sale" placeholder="$"><p class="help">Liens, back taxes, fees paid from proceeds</p></div>
        </fieldset>
        <fieldset class="space-y-3">
          <legend class="text-xs font-semibold mb-2" style="color:var(--gold-light)">Land contract</legend>
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" x-model="single.consider_land_contract">
            Consider selling on land contract
          </label>
          <div x-show="single.consider_land_contract" class="grid grid-cols-2 sm:grid-cols-5 gap-3">
            <div><label class="f">Sale price</label><input class="w-full" type="number" min="0" x-model="single.lc_sale_price" placeholder="$"><p class="help">Blank → 8% over after-repair value</p></div>
            <div><label class="f">Down payment %</label><input class="w-full" type="number" min="0" max="50" step="0.5" x-model="single.lc_down_pct" placeholder="10"></div>
            <div><label class="f">Interest rate %</label><input class="w-full" type="number" min="0" max="20" step="0.25" x-model="single.lc_rate_pct" placeholder="10"></div>
            <div><label class="f">Term (years)</label><input class="w-full" type="number" min="1" max="40" x-model="single.lc_term_years" placeholder="30"></div>
            <div><label class="f">Default risk %</label><input class="w-full" type="number" min="0" max="60" x-model="single.lc_default_pct" placeholder="20"><p class="help">Chance the buyer stops paying</p></div>
          </div>
          <p x-show="!single.consider_land_contract" class="help">The land contract will be shown as not considered and left out of the recommendation.</p>
        </fieldset>
        <div><label class="f">Other details</label><textarea class="w-full" rows="3" x-model="single.notes" placeholder="Condition, what the rehab covers, forfeiture history, mechanical issues…"></textarea></div>
        <details class="rounded-lg p-3" style="background:var(--navy-mid)">
          <summary class="text-xs font-semibold cursor-pointer">More details (optional)</summary>
          <div class="grid sm:grid-cols-4 gap-3 mt-3">
            <div><label class="f">Loan interest rate %</label><input class="w-full" type="number" step="0.01" min="0" x-model="single.loan_rate"><p class="help">Blank → 8% interest-only</p></div>
            <div><label class="f">Loan monthly P&amp;I</label><input class="w-full" type="number" min="0" x-model="single.loan_pi"></div>
            <div><label class="f">Property tax / year (if known)</label><input class="w-full" type="number" min="0" x-model="single.annual_tax"><p class="help">Your actual bill beats the database estimate</p></div>
            <div><label class="f">After-repair value (if known)</label><input class="w-full" type="number" min="0" x-model="single.arv"></div>
          </div>
        </details>
        <div x-show="singleError" class="text-sm" style="color:var(--red)" x-text="singleError"></div>
        <div class="flex flex-wrap items-center gap-3">
          <button class="btn btn-primary" :disabled="singleBusy||single.address.trim().length<5||!canAfford(1)" @click="submitSingle()"
            x-text="singleBusy ? 'Researching and comparing…' : ('Analyze · ' + tokens(1) + (isSuper || free ? '' : ' · Balance ' + (me?me.token_balance:0)))"></button>
          <button class="text-xs muted underline" @click="clearSingle()">Clear form</button>
          <span x-show="!canAfford(1)" class="text-xs" style="color:var(--gold-light)">You need <span x-text="cost"></span> tokens. Ask your admin to add tokens.</span>
        </div>
      </section>

      <section class="card rounded-xl overflow-hidden">
        <div class="px-5 py-3 flex items-center justify-between border-b" style="border-color:var(--border)">
          <h2 class="font-semibold">Batches</h2>
          <button class="text-xs muted" @click="loadBatches()">Refresh</button>
        </div>
        <p x-show="!batches.length" class="p-5 text-sm muted">Upload your inventory export to get a recommended exit for every property.</p>
        <div x-show="batches.length" class="overflow-x-auto">
          <table class="tbl">
            <thead><tr><th scope="col">File</th><th scope="col">Uploaded</th><th scope="col">Run by</th><th scope="col">Status</th><th scope="col" class="num">Properties</th><th scope="col" class="num">Tokens spent</th></tr></thead>
            <tbody>
              <template x-for="b in batches" :key="b.id">
                <tr class="clickable" @click="openBatch(b.id)">
                  <td><span x-text="b.file_name"></span> <span x-show="b.kind==='single'" class="chip">Single</span></td>
                  <td x-text="fmtDate(b.created_at)"></td>
                  <td x-text="b.run_by||'—'"></td>
                  <td><span class="chip" :class="statusChip(b.status)" x-text="b.status==='Paused' ? ('Paused ' + b.done + '/' + b.properties) : b.status"></span></td>
                  <td class="num" x-text="b.properties"></td>
                  <td class="num" x-text="b.tokens_spent"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </template>

  <!-- ─────────────── BATCH ─────────────── -->
  <template x-if="view==='batch' && batch">
    <div class="space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <button class="text-xs muted underline" @click="goHome()">← All batches</button>
          <h1 class="text-lg font-semibold mt-1"><span x-text="batch.kind==='single' ? 'Single: ' : 'Batch: '"></span><span x-text="batch.file_name"></span></h1>
          <p class="text-xs muted" x-text="fmtDate(batch.created_at) + ' · ' + batchStatus()"></p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button class="btn" @click="showAssumptions=!showAssumptions">Edit assumptions</button>
          <button class="btn" x-show="doneRows().length" @click="recalculate()" :disabled="recalcBusy" x-text="recalcBusy?'Recalculating…':'Recalculate · free'"></button>
          <button class="btn" x-show="doneRows().length" @click="exportExcel()">Export Excel</button>
        </div>
      </div>

      <div x-show="batch.duplicate_of" class="rounded-lg px-4 py-3 text-sm" style="background:rgba(216,168,61,.1);color:var(--gold-light)">
        These properties were analyzed on <span x-text="batch.duplicate_of&&fmtDate(batch.duplicate_of.created_at)"></span>. Running again charges again.
        <button class="underline" @click="openBatch(batch.duplicate_of.batch_id)">View that batch</button>
      </div>
      <div x-show="unmatchedLoans.length" class="rounded-lg px-4 py-3 text-sm" style="background:rgba(216,168,61,.1);color:var(--gold-light)">
        <span x-text="unmatchedLoans.length"></span> loan rows didn't match a property:
        <span x-text="unmatchedLoans.map(u=>u.address_line).join(', ')"></span>
      </div>
      <div x-show="isPaused()" class="rounded-lg px-4 py-3 text-sm flex items-center justify-between gap-3" style="background:var(--navy-mid)">
        <span>Paused at <span x-text="doneRows().length"></span> of <span x-text="countable().length"></span> when the tab closed.</span>
        <button class="btn btn-primary" @click="startQueue()" :disabled="!canAfford(1)">Resume</button>
      </div>

      <!-- Assumptions (D12) -->
      <section class="card rounded-xl p-4 space-y-3">
        <p class="text-sm">
          <span class="muted">Assumptions:</span>
          <span x-text="assumptionLine()"></span>
          <button class="underline text-xs muted ml-1" @click="showAssumptions=!showAssumptions" x-text="showAssumptions?'Close':'Edit'"></button>
        </p>
        <div x-show="showAssumptions" x-cloak class="space-y-4">
          <template x-for="group in assumptionGroups" :key="group.title">
            <fieldset>
              <legend class="text-xs font-semibold mb-2" style="color:var(--gold-light)" x-text="group.title"></legend>
              <p x-show="group.help" class="help mb-2" x-text="group.help"></p>
              <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3">
                <template x-for="f in group.fields" :key="f.key">
                  <div>
                    <label class="f" :style="isChanged(f.key)&&'color:var(--text);font-weight:700'" x-text="f.label"></label>
                    <template x-if="f.key==='owner_goal'">
                      <select class="w-full" x-model="assumptionDraft.owner_goal">
                        <option value="">None</option>
                        <option value="maximize_cash_now">Cash now</option>
                        <option value="maximize_total_return">Total return</option>
                        <option value="monthly_income">Monthly income</option>
                        <option value="minimize_effort">Least effort</option>
                      </select>
                    </template>
                    <template x-if="f.key==='lc_servicer'"><input class="w-full" x-model="assumptionDraft.lc_servicer" placeholder="e.g. SGMS"></template>
                    <template x-if="f.key!=='owner_goal'&&f.key!=='lc_servicer'"><input class="w-full" type="number" step="any" x-model.number="assumptionDraft[f.key]"></template>
                  </div>
                </template>
              </div>
            </fieldset>
          </template>
          <div x-show="assumptionError" class="text-sm" style="color:var(--red)" x-text="assumptionError"></div>
          <div class="flex gap-2">
            <button class="btn btn-primary" @click="saveAssumptions()" x-text="doneRows().length ? 'Save & recalculate · free' : 'Save'"></button>
            <button class="btn" @click="resetAssumptions()">Reset to defaults</button>
          </div>
        </div>
      </section>

      <!-- Loan statements (N3) -->
      <section class="card rounded-xl p-4 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="font-semibold text-sm">Loan statements <span class="muted font-normal" x-show="batch.statements.length" x-text="'· ' + confirmedStatements() + ' of ' + batch.statements.length + ' confirmed'"></span></h2>
            <p class="help">PDF, JPG or PNG up to 4 MB each. Files are deleted after you confirm them, or within 24 hours.</p>
          </div>
          <button class="btn" @click="$refs.stmts.click()" :disabled="stmtBusy" x-text="stmtBusy ? stmtProgress : '+ Add statements'"></button>
          <input x-ref="stmts" type="file" class="hidden" multiple accept=".pdf,.jpg,.jpeg,.png" @change="uploadStatements($event.target.files); $event.target.value=''">
        </div>
        <div x-show="batch.statements.length" class="overflow-x-auto">
          <table class="tbl">
            <caption class="sr-only">Loan statements</caption>
            <thead><tr><th scope="col">File</th><th scope="col">Property</th><th scope="col">Match</th><th scope="col">Payoff</th><th scope="col">Rate %</th><th scope="col">P&amp;I</th><th scope="col">Date</th><th scope="col">Spreadsheet</th><th scope="col">Status</th><th></th></tr></thead>
            <tbody>
              <template x-for="st in batch.statements" :key="st.id">
                <tr>
                  <td class="max-w-[10rem] truncate" :title="st.file_name">
                    <button x-show="st.has_file" class="underline" @click="viewStatement(st)" x-text="st.file_name"></button>
                    <span x-show="!st.has_file" x-text="st.file_name"></span>
                    <p x-show="st.extracted&&st.extracted.snippets&&st.extracted.snippets.payoff_amount" class="help truncate" x-text="'p.' + ((st.extracted&&st.extracted.page)||'?') + ': “' + ((st.extracted&&st.extracted.snippets&&st.extracted.snippets.payoff_amount)||'') + '”'"></p>
                  </td>
                  <td>
                    <template x-if="st.row_id && st.match_tier!=='multi'"><span x-text="rowAddress(st.row_id)"></span></template>
                    <template x-if="!st.confirmed && st.status==='read' && (!st.row_id || st.match_tier==='likely')">
                      <select class="w-40 mt-1" @change="assignStatement(st, $event.target.value)">
                        <option value="">Assign to…</option>
                        <template x-for="r in batch.rows" :key="r.id"><option :value="r.id" :selected="r.id===st.row_id" x-text="r.inputs.address_line + ', ' + (r.inputs.city||'')"></option></template>
                      </select>
                    </template>
                  </td>
                  <td>
                    <span x-show="st.match_tier==='exact'" class="chip chip-green">Exact</span>
                    <span x-show="st.match_tier==='likely'" class="chip chip-gold">Check match</span>
                    <span x-show="st.match_tier==='manual'" class="chip">Manual</span>
                    <span x-show="st.match_tier==='multi'" class="chip chip-gold" x-text="'Covers ' + st.covers + ' properties'"></span>
                    <span x-show="st.match_tier==='none'" class="chip chip-red">Unmatched</span>
                  </td>
                  <template x-if="st.status==='read'">
                    <td><input class="w-28" type="number" x-model.number="stmtEdit(st).payoff" :placeholder="'Not found · enter'"></td>
                  </template>
                  <template x-if="st.status==='read'"><td><input class="w-20" type="number" step="0.01" x-model.number="stmtEdit(st).rate"></td></template>
                  <template x-if="st.status==='read'"><td><input class="w-24" type="number" x-model.number="stmtEdit(st).pi"></td></template>
                  <template x-if="st.status!=='read'">
                    <td class="num" x-text="st.confirmed_values ? money(st.confirmed_values.payoff) : '—'"></td>
                  </template>
                  <template x-if="st.status!=='read'"><td class="num" x-text="st.confirmed_values&&st.confirmed_values.rate!=null ? st.confirmed_values.rate + '%' : '—'"></td></template>
                  <template x-if="st.status!=='read'"><td class="num" x-text="st.confirmed_values ? money(st.confirmed_values.pi) : '—'"></td></template>
                  <td>
                    <span x-text="st.statement_date||'—'"></span>
                    <span x-show="st.stale" class="chip chip-gold" x-text="'Stale (' + st.stale_days + ' days)'"></span>
                  </td>
                  <td class="num">
                    <span x-text="st.row_id ? money(rowLoan(st.row_id)) : '—'"></span>
                    <span x-show="st.status==='read' && differs(st)" class="chip chip-gold">Differs from spreadsheet</span>
                  </td>
                  <td><span class="chip" :class="stmtChip(st)" x-text="stmtStatusLabel(st)"></span></td>
                  <td class="whitespace-nowrap">
                    <button x-show="st.status==='read' && st.row_id && st.match_tier!=='multi'" class="btn btn-primary"
                      :disabled="!stmtReady(st)" @click="confirmStatement(st)" x-text="st.stale ? 'Confirm anyway' : 'Confirm'"></button>
                    <button class="text-xs muted underline ml-1" @click="removeStatement(st)">Remove</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Totals strip (D4) -->
      <section x-show="doneRows().length" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="card rounded-xl p-3"><p class="text-xs muted">Analyzed</p><p class="text-lg font-semibold" x-text="doneRows().length + ' of ' + countable().length"></p></div>
        <div class="card rounded-xl p-3"><p class="text-xs muted">Carry / month</p><p class="text-lg font-semibold" x-text="money(totalCarry())"></p></div>
        <div class="card rounded-xl p-3"><p class="text-xs muted">At stake vs. sell as-is</p><p class="text-lg font-semibold" x-text="money(totalStake())"></p></div>
        <div class="card rounded-xl p-3"><p class="text-xs muted mb-1">Recommended exits</p>
          <template x-for="[k,n] in exitCounts()" :key="k"><span class="exit-badge mr-1 mb-1" x-text="label(k) + ' ' + n"></span></template>
        </div>
      </section>

      <!-- Progress meter (D8) -->
      <section x-show="queueRunning || failedRows().length || waitingTokens" class="card rounded-xl p-4 flex flex-wrap items-center justify-between gap-3 text-sm">
        <p>
          <span x-text="doneRows().length"></span> done ·
          <span x-text="failedRows().length"></span> failed ·
          <span x-text="queuedRows().length"></span> left ·
          <span x-text="tokensSpent()"></span> tokens spent
          <span x-show="queueRunning && eta()" x-text="' · ~' + eta() + ' min left'"></span>
        </p>
        <p x-show="queueRunning" class="text-xs muted">Keep this tab open. You can use other tabs; closing this one pauses the batch.</p>
        <p x-show="waitingTokens" class="text-xs" style="color:var(--gold-light)">Waiting for tokens. Top up to continue.</p>
        <div class="flex gap-2">
          <button x-show="queueRunning" class="btn" @click="stopQueue()">Pause</button>
          <button x-show="!queueRunning && failedRows().length" class="btn" :disabled="!canAfford(failedRows().length)" @click="retryFailed()"
            x-text="'Retry failed rows (' + failedRows().length + (free ? ', free' : ' × ' + cost + ' tokens') + ')'"></button>
        </div>
      </section>

      <!-- Preview / summary table -->
      <section class="card rounded-xl overflow-hidden">
        <div class="px-4 py-3 flex flex-wrap items-center gap-3 border-b" style="border-color:var(--border)">
          <h2 class="font-semibold text-sm mr-auto" x-text="doneRows().length ? 'Properties' : 'Preview'"></h2>
          <p x-show="flagSummary()" class="text-xs muted w-full sm:w-auto" x-text="flagSummary()"></p>
          <select x-model="filterExit" aria-label="Filter by exit"><option value="">All exits</option><template x-for="k in STRATS" :key="k"><option :value="k" x-text="label(k)"></option></template></select>
          <select x-model="filterPortfolio" aria-label="Filter by portfolio"><option value="">All portfolios</option><template x-for="p in portfolios()" :key="p"><option :value="p" x-text="p"></option></template></select>
          <select x-model="filterFlag" aria-label="Filter by flag"><option value="">All flags</option><template x-for="f in allFlags()" :key="f"><option :value="f" x-text="f"></option></template></select>
        </div>
        <div class="overflow-x-auto max-h-[70vh]">
          <table class="tbl">
            <caption class="sr-only">Properties in this batch</caption>
            <thead><tr>
              <th scope="col" class="sticky-col">Address</th>
              <th scope="col">Portfolio</th>
              <th scope="col">Status / exit</th>
              <th scope="col" class="num">$ at stake</th>
              <th scope="col" class="num">Value today (best)</th>
              <th scope="col" class="num">Sell as-is</th>
              <th scope="col" class="num">Comps (ARV)</th>
              <th scope="col" class="num">Rehab</th>
              <th scope="col" class="num">Loan</th>
              <th scope="col" class="num">Carry/mo</th>
              <th scope="col">Confidence</th>
              <th scope="col">Flags</th>
              <th scope="col" x-show="!allDone()">Include</th>
              <th></th>
            </tr></thead>
            <tbody>
              <template x-for="r in visibleRows()" :key="r.id">
                <tr :class="r.analysis&&'clickable'" @click="r.analysis && openReport(r)">
                  <td class="sticky-col font-medium" x-text="r.inputs.address_line + (r.inputs.city ? ', ' + r.inputs.city : '')"></td>
                  <td class="muted" x-text="r.inputs.portfolio||'—'"></td>
                  <td>
                    <template x-if="r.status==='done'||(r.analysis&&r.status!=='running')">
                      <span>
                        <span x-show="!recOf(r).close_call" class="exit-badge" x-text="label(recOf(r).strategy)"></span>
                        <span x-show="recOf(r).close_call" class="exit-badge" style="color:var(--gold-light)" x-text="'Close call: ' + label(recOf(r).strategy) + ' / ' + label(recOf(r).runner_up)"></span>
                      </span>
                    </template>
                    <template x-if="r.status==='running'"><span class="chip chip-gold"><span class="spin">◌</span> <span x-text="stepLabel(r.step)"></span></span></template>
                    <template x-if="r.status==='queued'"><span class="chip" x-text="r.error==='Reset after tab closed' ? 'Re-queued' : (waitingTokens&&r.include ? 'Waiting for tokens' : 'Queued')"></span></template>
                    <template x-if="r.status==='failed_refunded'"><span><span class="chip chip-red">Failed · refunded</span><p class="help" style="color:#fca5a5" x-text="r.error"></p></span></template>
                    <template x-if="r.status==='failed_charged'"><span><span class="chip chip-red">Failed · not refunded</span><p class="help">Analysis had started</p></span></template>
                    <template x-if="r.status==='skipped_pending'"><span class="chip">Pending sale · not analyzed, not charged</span></template>
                    <template x-if="r.status==='excluded'"><span class="chip">Excluded</span></template>
                  </td>
                  <td class="num" x-text="r.analysis ? money(r.dollars_at_stake) : ''"></td>
                  <td class="num" x-text="r.analysis ? money(bestValue(r)) : ''"></td>
                  <td class="num" x-text="r.analysis ? money(scen(r,'sell_as_is').risk_adjusted_score) : ''"></td>
                  <td class="num" x-text="money(r.overrides.arv ?? r.inputs.arv)"></td>
                  <td class="num" x-text="(r.overrides.rehab_budget ?? r.inputs.rehab_quote) != null ? money(r.overrides.rehab_budget ?? r.inputs.rehab_quote) : 'Unknown'"></td>
                  <td class="num" x-text="loanOf(r) ? money(loanOf(r)) : 'None ($0)'"></td>
                  <td class="num" x-text="r.analysis ? money(carryOf(r)) : ''"></td>
                  <td><span x-show="r.analysis" :class="confClass(r)" class="text-xs font-semibold" x-text="r.analysis&&r.analysis.property.confidence"></span></td>
                  <td class="max-w-[16rem]"><template x-for="f in r.flags" :key="f"><span class="chip" :class="flagChip(f)" x-text="f"></span></template></td>
                  <td x-show="!allDone()" @click.stop>
                    <input type="checkbox" :checked="r.include" :disabled="r.status==='done'||r.status==='running'||queueRunning" @change="toggleInclude(r, $event.target.checked)" :aria-label="'Include ' + r.inputs.address_line">
                  </td>
                  <td @click.stop><button class="text-xs underline muted" :disabled="r.status==='running'" @click="openDrawer(r)">Edit</button></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Sticky cost footer (D7) -->
      <div x-show="!queueRunning && queuedRows().length" class="card rounded-xl p-4 flex flex-wrap items-center justify-between gap-3 sticky bottom-3">
        <p class="text-sm">
          <span x-text="queuedRows().length"></span> properties<span x-show="!free"> × <span x-text="cost"></span></span> = <strong x-text="tokens(queuedRows().length)"></strong>
          <span class="muted" x-show="!free" x-text="'($' + (queuedRows().length*cost*5).toLocaleString() + ')'"></span>
          <span class="muted" x-show="!isSuper && !free" x-text="' · Balance ' + (me?me.token_balance:0)"></span>
          <span x-show="batch.unconfirmed_statements" class="chip chip-gold" x-text="batch.unconfirmed_statements + ' statements unconfirmed'"></span>
        </p>
        <div class="flex items-center gap-2">
          <span x-show="!canAfford(1)" class="text-xs" style="color:var(--gold-light)">Not enough tokens. Ask your admin to add tokens.</span>
          <button class="btn btn-primary" :disabled="!canAfford(1)" @click="confirmStart()" x-text="'Start · ' + tokens(queuedRows().length)"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- ─────────────── REPORT (D6) ─────────────── -->
  <template x-if="view==='report' && report">
    <div class="space-y-5">
      <div class="card rounded-xl px-4 py-2 flex items-center justify-between text-sm sticky top-16 z-40">
        <button class="btn" :disabled="reportIndex()<=0" @click="stepReport(-1)">← Prev</button>
        <span class="muted" x-text="(reportIndex()+1) + ' of ' + reportList().length"></span>
        <div class="flex gap-2">
          <button class="btn" @click="openReportEdit()">Edit assumptions &amp; rerun</button>
          <button class="btn" :disabled="reportIndex()>=reportList().length-1" @click="stepReport(1)">Next →</button>
          <button class="btn" @click="view='batch'">Back to summary</button>
        </div>
      </div>

      <!-- memo header (D12) -->
      <section class="card rounded-xl p-5 space-y-2">
        <p class="text-xs muted" x-text="'Internal memo · ' + tenantName + ' · ' + fmtDate(new Date().toISOString())"></p>
        <h1 class="text-xl font-semibold" x-text="report.inputs.address_line + ', ' + (report.inputs.city||'') + ' ' + (report.inputs.state||'MI')"></h1>
        <p class="text-sm">
          <span class="muted">Confidence:</span> <span :class="confClass(report)" class="font-semibold" x-text="report.analysis.property.confidence"></span>
          <template x-for="f in report.flags" :key="f"><span class="chip ml-1" :class="flagChip(f)" x-text="f"></span></template>
        </p>
      </section>

      <!-- Your four options -->
      <section>
        <div class="flex items-center justify-between gap-2 mb-3 px-1">
          <h2 class="font-semibold">Your four options</h2>
          <button class="btn btn-primary" @click="openReportEdit()">Edit assumptions &amp; rerun</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <template x-for="k in STRATS" :key="k">
            <div class="card rounded-xl p-4 space-y-2" :style="k===recOf(report).strategy && 'border:2px solid var(--gold-light)'">
              <div class="flex items-start justify-between gap-2">
                <span class="font-semibold text-sm" x-text="label(k)"></span>
                <span class="exit-badge" :class="k===recOf(report).strategy?'chip-gold':''"
                  :style="!scen(report,k).eligible ? 'color:var(--red)' : (k===recOf(report).strategy?'color:var(--gold-light)':'')"
                  x-text="k===recOf(report).strategy ? 'Recommended' : (!scen(report,k).eligible ? 'Ruled out' : (k===recOf(report).runner_up ? 'Runner-up' : 'Option'))"></span>
              </div>
              <p class="text-2xl font-semibold" x-text="money(scen(report,k).net_profit)"></p>
              <p class="text-xs muted -mt-2">Net cash to you</p>
              <div class="text-sm space-y-1 pt-2 border-t" style="border-color:var(--border)">
                <div class="flex justify-between gap-2"><span class="muted">Value today (risk-adjusted)</span><span class="text-right" x-text="money(scen(report,k).risk_adjusted_score)"></span></div>
                <div class="flex justify-between gap-2"><span class="muted">Time to cash</span><span class="text-right" x-text="scen(report,k).timeline_months + ' months' + ((k==='rehab_rent'||k==='rehab_land_contract') && scen(report,k).liquidity_label ? ' · ' + scen(report,k).liquidity_label : '')"></span></div>
                <div class="flex justify-between gap-2"><span class="muted">Cash you put in</span><span class="text-right" x-text="money(scen(report,k).peak_capital)"></span></div>
                <div class="flex justify-between gap-2"><span class="muted">Risk</span><span class="text-right" :style="riskColor(scen(report,k).risk_score)" x-text="riskLabel(scen(report,k).risk_score) + ' (' + (scen(report,k).risk_score??'—') + '/10)'"></span></div>
                <div class="flex justify-between gap-2"><span class="muted">Effort</span><span class="text-right" x-text="scen(report,k).effort||'—'"></span></div>
              </div>
              <p x-show="scen(report,k).disqualifier" class="text-xs" style="color:var(--red)" x-text="'Ruled out: ' + scen(report,k).disqualifier"></p>
              <p x-show="scen(report,k).shortfall>0" class="text-xs" style="color:var(--red)" x-text="'Short ' + money(scen(report,k).shortfall) + ' at closing'"></p>
            </div>
          </template>
        </div>
        <p x-show="recOf(report).close_call" class="text-xs mt-2" style="color:var(--gold-light)">Close call: within 5% — the faster, lower-capital exit is preferred.</p>
      </section>

      <!-- Why -->
      <section class="card rounded-xl p-5 space-y-3">
        <h2 class="font-semibold">Why</h2>
        <div class="rounded-lg px-4 py-3" style="background:var(--navy-mid)">
          <p class="font-semibold" x-html="banner(report)"></p>
        </div>
        <p x-show="report.rationale_stale" class="text-xs" style="color:var(--gold-light)">Written before your latest edits. The numbers are current.</p>
        <div class="prose-report text-sm" x-html="report.writeup ? md(writeupSection(report.writeup,'Recommendation')) : md(report.rationale || '')"></div>
        <div>
          <h3 class="font-semibold text-sm mb-1">What would change the answer</h3>
          <template x-if="report.writeup && writeupSection(report.writeup,'What would change the answer')">
            <div class="prose-report text-sm" x-html="md(writeupSection(report.writeup,'What would change the answer'))"></div>
          </template>
          <template x-if="!report.writeup || !writeupSection(report.writeup,'What would change the answer')">
            <div>
              <p x-show="!recOf(report).break_even_triggers.length" class="text-sm muted">No single input within ±50% flips the recommendation.</p>
              <ul class="text-sm space-y-1 list-disc ml-5">
                <template x-for="t in recOf(report).break_even_triggers" :key="t.variable + t.direction">
                  <li x-text="'If ' + t.label + ' is ' + t.direction + ' ' + money(t.threshold) + ', ' + label(t.new_winner) + ' wins.'"></li>
                </template>
              </ul>
            </div>
          </template>
        </div>
      </section>

      <!-- Red flags & what to do -->
      <section class="card rounded-xl p-5 space-y-3" x-show="report.analysis.flags.length">
        <h2 class="font-semibold">Red flags &amp; what to do</h2>
        <div class="space-y-2">
          <template x-for="f in sortedFlags(report)" :key="f.message">
            <div class="pl-3 py-1" :style="'border-left:3px solid ' + (f.severity==='critical'?'#ef4444':(f.severity==='warning'?'var(--gold)':'var(--border)'))">
              <span class="chip" :class="f.severity==='critical'?'chip-red':(f.severity==='warning'?'chip-gold':'')" x-text="f.severity"></span>
              <p class="text-sm font-semibold mt-1" x-text="f.message"></p>
              <p x-show="f.suggestion" class="text-sm muted" x-text="'What to do: ' + f.suggestion"></p>
            </div>
          </template>
        </div>
        <template x-if="report.writeup && writeupSection(report.writeup,'Next Steps')">
          <div>
            <h3 class="font-semibold text-sm mb-1">Next steps</h3>
            <div class="prose-report text-sm" x-html="md(writeupSection(report.writeup,'Next Steps'))"></div>
          </div>
        </template>
      </section>

      <!-- Financial examples -->
      <section>
        <h2 class="font-semibold mb-3 px-1">Financial examples</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <template x-for="k in STRATS" :key="k">
            <div class="card rounded-xl p-4" :style="k===recOf(report).strategy && 'border:2px solid var(--gold-light)'">
              <p class="font-semibold text-sm mb-2" x-text="label(k)"></p>
              <table class="tbl">
                <tbody>
                  <template x-for="row in (scen(report,k).details && scen(report,k).details.waterfall)||[]" :key="row.label">
                    <tr :style="row.total && 'border-top:1px solid var(--border);font-weight:700'">
                      <td x-text="row.label"></td>
                      <td class="num" :style="row.amount<0 && 'color:var(--muted)'" x-text="money(row.amount)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </div>

        <details class="card rounded-xl p-4 mt-4">
          <summary class="font-semibold cursor-pointer">Detailed metrics</summary>
          <div class="overflow-x-auto mt-3">
            <table class="tbl">
              <caption class="sr-only">Exit comparison</caption>
              <thead><tr>
                <th scope="col" class="sticky-col">Metric</th>
                <template x-for="k in STRATS" :key="k">
                  <th scope="col" class="num" :class="[k===recOf(report).strategy&&'rec-col', !scen(report,k).eligible&&'dq']">
                    <span x-text="label(k)"></span>
                    <p x-show="k==='rehab_land_contract' && report.analysis.assumptions.find(a=>a.name==='lc_servicer'&&a.value)" class="help" x-text="'Serviced by ' + ((report.analysis.assumptions.find(a=>a.name==='lc_servicer')||{}).value||'')"></p>
                  </th>
                </template>
              </tr></thead>
              <tbody>
                <template x-for="m in METRICS" :key="m.key">
                  <tr>
                    <th scope="row" class="sticky-col" :style="m.bold&&'color:var(--text)'" x-text="m.label"></th>
                    <template x-for="k in STRATS" :key="k">
                      <td class="num" :class="[k===recOf(report).strategy&&'rec-col', !scen(report,k).eligible&&'dq']" :style="m.bold&&'font-weight:700'" x-text="fmtMetric(m, scen(report,k))"></td>
                    </template>
                  </tr>
                </template>
                <tr>
                  <th scope="row" class="sticky-col">Ruled out</th>
                  <template x-for="k in STRATS" :key="k"><td class="text-xs" style="color:#fca5a5" x-text="scen(report,k).disqualifier||''"></td></template>
                </tr>
              </tbody>
            </table>
          </div>
        </details>

        <details class="card rounded-xl p-4 mt-4">
          <summary class="font-semibold cursor-pointer">Stress tests (NPV)</summary>
          <p class="help mt-1">Worst result per exit is marked.</p>
          <div class="overflow-x-auto mt-3">
            <table class="tbl">
              <thead><tr><th scope="col" class="sticky-col">Scenario</th><template x-for="k in STRATS" :key="k"><th scope="col" class="num" x-text="label(k)"></th></template></tr></thead>
              <tbody>
                <template x-for="s in STRESS" :key="s.key">
                  <tr>
                    <th scope="row" class="sticky-col" x-text="s.label"></th>
                    <template x-for="k in STRATS" :key="k">
                      <td class="num" :style="isWorst(report,k,s.key)&&'color:#fca5a5;font-weight:700'" x-text="money(scen(report,k).stress_tests[s.key]) + (isWorst(report,k,s.key)?' ▼':'')"></td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </details>
      </section>

      <!-- Land Contract Sale -->
      <section class="card rounded-xl p-5 space-y-4">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <h2 class="font-semibold">Land Contract Sale</h2>
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" :checked="lcConsidered(report)" :disabled="lcBusy" @change="toggleLc(report, $event.target.checked)">
            Consider for this property
          </label>
          <span x-show="!lcD(report).servicer" class="text-xs" style="color:var(--red)">No servicer set: compliance review required</span>
          <span x-show="lcD(report).servicer" class="text-xs muted" x-text="'Serviced by ' + lcD(report).servicer"></span>
        </div>
        <p x-show="!lcConsidered(report)" class="text-sm" style="color:var(--gold-light)">Land contract is turned off for this property: it is shown for reference and left out of the recommendation.</p>

        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
          <div>
            <label class="f">Sale price ($)</label>
            <input class="w-full" type="number" min="0" x-model.number="lcForm.sale_price" @input="lcScheduleRecalc()">
            <p class="help" x-show="lcPriceVsArv()" x-text="lcPriceVsArv()"></p>
            <p class="help" style="color:var(--gold-light)" x-show="lcHint('sale_price')" x-text="lcHint('sale_price')"></p>
          </div>
          <div>
            <label class="f">Down payment (%)</label>
            <input class="w-full" type="number" min="0" max="100" step="0.1" x-model.number="lcForm.down_pct" @input="lcScheduleRecalc()">
            <p class="help" style="color:var(--gold-light)" x-show="lcHint('down_pct')" x-text="lcHint('down_pct')"></p>
          </div>
          <div>
            <label class="f">Interest rate (%)</label>
            <input class="w-full" type="number" min="0" step="0.01" x-model.number="lcForm.rate_pct" @input="lcScheduleRecalc()">
            <p class="help" style="color:var(--gold-light)" x-show="lcHint('rate_pct')" x-text="lcHint('rate_pct')"></p>
          </div>
          <div>
            <label class="f">Term (years)</label>
            <input class="w-full" type="number" min="1" x-model.number="lcForm.term_years" @input="lcScheduleRecalc()">
            <p class="help" style="color:var(--gold-light)" x-show="lcHint('term_years')" x-text="lcHint('term_years')"></p>
          </div>
          <div>
            <label class="f">Default risk (%)</label>
            <input class="w-full" type="number" min="0" max="100" step="0.1" x-model.number="lcForm.default_prob_pct" @input="lcScheduleRecalc()">
            <p class="help" style="color:var(--gold-light)" x-show="lcHint('default_prob_pct')" x-text="lcHint('default_prob_pct')"></p>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <button class="btn" :disabled="lcBusy" @click="resetLc(report)">Reset to batch terms</button>
          <span class="text-xs muted" x-text="lcBusy ? 'Updating…' : 'Numbers update as you type'"></span>
          <span x-show="lcError" class="text-sm" style="color:var(--red)" x-text="lcError"></span>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div class="rounded-lg p-3" style="background:var(--navy-mid)"><p class="text-xs muted">Sale price</p><p class="font-semibold" x-text="money(lcD(report).lc_price)"></p></div>
          <div class="rounded-lg p-3" style="background:var(--navy-mid)"><p class="text-xs muted">Down payment</p><p class="font-semibold" x-text="money(lcD(report).down_payment)"></p><p class="help" x-text="(lcD(report).down_pct!=null?lcD(report).down_pct:'—') + '% at closing'"></p></div>
          <div class="rounded-lg p-3" style="background:var(--navy-mid)"><p class="text-xs muted">Amount financed</p><p class="font-semibold" x-text="money(lcD(report).principal)"></p><p class="help" x-text="(lcD(report).lc_price ? Math.round(100*(lcD(report).principal||0)/lcD(report).lc_price) : '—') + '% financed'"></p></div>
          <div class="rounded-lg p-3" style="background:var(--navy-mid)"><p class="text-xs muted">Buyer's monthly payment</p><p class="font-semibold" x-text="money1(lcD(report).monthly_payment)"></p></div>
        </div>

        <div class="text-sm space-y-1">
          <div class="flex justify-between"><span class="muted">Principal &amp; interest</span><span x-text="money1(lcD(report).monthly_payment)"></span></div>
          <div class="flex justify-between"><span class="muted">Est. property tax</span><span x-text="money1(lcD(report).buyer_monthly_tax)"></span></div>
          <div class="flex justify-between"><span class="muted">Est. insurance</span><span x-text="money1(lcD(report).buyer_monthly_insurance)"></span></div>
          <div class="flex justify-between font-semibold pt-1 border-t" style="color:var(--green-light);border-color:var(--border)"><span>Buyer's total monthly</span><span x-text="money1((lcD(report).monthly_payment||0)+(lcD(report).buyer_monthly_tax||0)+(lcD(report).buyer_monthly_insurance||0))"></span></div>
        </div>

        <div class="text-sm space-y-1 pt-2 border-t" style="border-color:var(--border)">
          <div class="flex justify-between"><span class="muted">Cash to you at closing</span><span :style="lcD(report).closing_cash<0 && 'color:var(--red)'" x-text="money(lcD(report).closing_cash)"></span></div>
          <p class="help">after closing costs and paying off your loan</p>
          <div class="flex justify-between"><span class="muted" x-text="'Interest earned over ' + ((lcD(report).balloon_month||0)-(lcD(report).closing_month||0)) + ' months'"></span><span x-text="money(lcD(report).total_interest_earned)"></span></div>
          <div class="flex justify-between"><span class="muted" x-text="'Balloon at month ' + (lcD(report).balloon_month??'—')"></span><span x-text="money(lcD(report).balloon_balance)"></span></div>
          <div class="flex justify-between" x-show="lcD(report).investor_payback>0"><span class="muted">Investor payback (paid at balloon or note sale)</span><span x-text="money(lcD(report).investor_payback)"></span></div>
          <div class="flex justify-between"><span class="muted">Expected net cash (incl. default risk)</span><span x-text="money(scen(report,'rehab_land_contract').net_profit)"></span></div>
          <div class="flex justify-between"><span class="muted">vs. sell as-is</span><span :style="(scen(report,'rehab_land_contract').net_profit-scen(report,'sell_as_is').net_profit)>=0 ? 'color:var(--green-light)' : 'color:var(--red)'" x-text="money(scen(report,'rehab_land_contract').net_profit-scen(report,'sell_as_is').net_profit)"></span></div>
        </div>

        <div class="rounded-lg p-3 text-sm" style="background:var(--navy-mid)">
          <p x-text="'If the buyer defaults (' + (lcD(report).default_prob_pct??'—') + '% chance): payments stop around month 14, you carry the property, then resell as-is around month 20.'"></p>
          <div class="grid grid-cols-2 gap-3 mt-2">
            <div><p class="text-xs muted">Value if the buyer pays</p><p x-text="money(lcD(report).performing_npv)"></p></div>
            <div><p class="text-xs muted">Value if the buyer defaults</p><p x-text="money(lcD(report).default_npv)"></p></div>
          </div>
        </div>
      </section>

      <!-- Comparable sales -->
      <section class="card rounded-xl p-5 space-y-3">
        <h2 class="font-semibold">Comparable sales</h2>
        <p class="text-xs muted" x-show="report.estimates && report.estimates.comp_search" x-text="report.estimates && report.estimates.comp_search && (String(report.estimates.comp_search.sale_radius).replace(/\s*mi$/, '') + ' mi radius · '+ report.estimates.comp_search.sale_window_days + ' day window · ' + report.estimates.comp_search.confidence + ' confidence' + (report.estimates.comp_search.notes ? ' · ' + report.estimates.comp_search.notes : ''))"></p>
        <p x-show="!(report.estimates && report.estimates.sale_comps && report.estimates.sale_comps.length)" class="text-sm muted">No sale comps were returned for this property.</p>
        <div x-show="report.estimates && report.estimates.sale_comps && report.estimates.sale_comps.length" class="overflow-x-auto">
          <table class="tbl">
            <thead><tr><th scope="col">Address</th><th scope="col" class="num">Sale price</th><th scope="col">Beds/Ba</th><th scope="col" class="num">Sq ft</th><th scope="col" class="num">$/sq ft</th><th scope="col">Distance</th><th scope="col">Sale date</th><th scope="col">Condition · used for</th><th scope="col">Source</th><th scope="col">Notes</th></tr></thead>
            <tbody>
              <template x-for="c in (report.estimates && report.estimates.sale_comps)||[]" :key="c.address">
                <tr>
                  <td x-text="c.address"></td>
                  <td class="num" x-text="money(c.sale_price)"></td>
                  <td x-text="(c.beds??'—') + '/' + (c.baths??'—')"></td>
                  <td class="num" x-text="c.sqft ?? '—'"></td>
                  <td class="num" x-text="(c.sale_price && c.sqft) ? money1(c.sale_price/c.sqft) : '—'"></td>
                  <td x-text="c.distance||'—'"></td>
                  <td x-text="c.sale_date||'—'"></td>
                  <td x-text="(c.condition||'—') + ' · ' + (c.used_for||'—')"></td>
                  <td x-text="c.source||'—'"></td>
                  <td class="text-xs muted" x-text="[c.selection_rationale, c.adjustments].filter(Boolean).join(' · ')"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Rental comparables -->
      <section class="card rounded-xl p-5 space-y-3">
        <h2 class="font-semibold">Rental comparables</h2>
        <p class="text-sm muted" x-text="'Market rent used: ' + money1(scen(report,'rehab_rent').details && scen(report,'rehab_rent').details.market_rent) + '/mo'"></p>
        <p x-show="!(report.estimates && report.estimates.rental_comps && report.estimates.rental_comps.length)" class="text-sm muted">No rental comps were returned for this property.</p>
        <div x-show="report.estimates && report.estimates.rental_comps && report.estimates.rental_comps.length" class="overflow-x-auto">
          <table class="tbl">
            <thead><tr><th scope="col">Address / neighborhood</th><th scope="col" class="num">Rent</th><th scope="col">Beds/Ba</th><th scope="col" class="num">Sq ft</th><th scope="col">Distance</th><th scope="col">Listed/leased</th><th scope="col">Condition / features</th><th scope="col">Source</th></tr></thead>
            <tbody>
              <template x-for="c in (report.estimates && report.estimates.rental_comps)||[]" :key="c.address">
                <tr>
                  <td><span x-text="c.address"></span><p class="help" x-text="c.neighborhood||''"></p></td>
                  <td class="num" x-text="money1(c.monthly_rent)"></td>
                  <td x-text="(c.beds??'—') + '/' + (c.baths??'—')"></td>
                  <td class="num" x-text="c.sqft ?? '—'"></td>
                  <td x-text="c.distance||'—'"></td>
                  <td x-text="(c.listed_or_leased_date||'—') + ' · ' + (c.status||'—')"></td>
                  <td x-text="c.condition_features||'—'"></td>
                  <td x-text="c.source||'—'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Market conditions -->
      <section class="card rounded-xl p-5 space-y-3">
        <h2 class="font-semibold">Market conditions</h2>
        <template x-if="report.estimates && report.estimates.market">
          <div class="space-y-3">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div x-show="report.estimates.market.classification" class="rounded-lg p-3" style="background:var(--navy-mid)"><p class="text-xs muted">Classification</p><p class="font-semibold" x-text="report.estimates.market.classification"></p></div>
              <div x-show="report.estimates.market.median_sale_price!=null" class="rounded-lg p-3" style="background:var(--navy-mid)"><p class="text-xs muted">Median sale price</p><p class="font-semibold" x-text="money(report.estimates.market.median_sale_price)"></p></div>
              <div x-show="report.estimates.market.price_trend_yoy_pct!=null" class="rounded-lg p-3" style="background:var(--navy-mid)"><p class="text-xs muted">Price trend YoY</p><p class="font-semibold" x-text="report.estimates.market.price_trend_yoy_pct + '%'"></p></div>
              <div x-show="report.estimates.market.days_on_market!=null" class="rounded-lg p-3" style="background:var(--navy-mid)"><p class="text-xs muted">Days on market</p><p class="font-semibold" x-text="report.estimates.market.days_on_market"></p></div>
              <div x-show="report.estimates.market.months_of_inventory!=null" class="rounded-lg p-3" style="background:var(--navy-mid)"><p class="text-xs muted">Months of inventory</p><p class="font-semibold" x-text="report.estimates.market.months_of_inventory"></p></div>
              <div x-show="report.estimates.market.rent_trend_yoy_pct!=null" class="rounded-lg p-3" style="background:var(--navy-mid)"><p class="text-xs muted">Rent trend YoY</p><p class="font-semibold" x-text="report.estimates.market.rent_trend_yoy_pct + '%'"></p></div>
              <div x-show="report.estimates.market.vacancy_rate_pct!=null" class="rounded-lg p-3" style="background:var(--navy-mid)"><p class="text-xs muted">Vacancy rate</p><p class="font-semibold" x-text="report.estimates.market.vacancy_rate_pct + '%'"></p></div>
            </div>
            <ul x-show="report.estimates.market.drivers && report.estimates.market.drivers.length" class="text-sm list-disc ml-5 space-y-1">
              <template x-for="d in report.estimates.market.drivers||[]" :key="d"><li x-text="d"></li></template>
            </ul>
            <p x-show="report.estimates.market.outlook_12mo" class="text-sm" x-text="report.estimates.market.outlook_12mo"></p>
          </div>
        </template>
        <template x-if="report.writeup && writeupSection(report.writeup,'Market Conditions')">
          <div class="prose-report text-sm" x-html="md(writeupSection(report.writeup,'Market Conditions'))"></div>
        </template>
      </section>

      <!-- Neighborhood -->
      <section class="card rounded-xl p-5 space-y-3">
        <h2 class="font-semibold">Neighborhood</h2>
        <template x-if="report.writeup">
          <div class="prose-report text-sm" x-html="md(writeupSection(report.writeup,'Neighborhood Quality'))"></div>
        </template>
        <template x-if="!report.writeup">
          <div>
            <template x-if="writeupBusy">
              <div>
                <div class="py-8 sm:py-12 text-center" role="status" aria-live="polite">
          <div class="status-icon w-16 h-16 mx-auto rounded-2xl flex items-center justify-center" style="background:rgba(45,138,78,.16);color:var(--green)">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M12 3v3m0 12v3M3 12h3m12 0h3m-3.64-6.36l-2.12 2.12m-8.48 8.48l-2.12 2.12m0-12.72l2.12 2.12m8.48 8.48l2.12 2.12M9 9l6 6m0-6l-6 6"/>
            </svg>
          </div>
          <p class="mt-5 text-lg font-semibold" style="color:var(--text)" x-text="STATUSES[statusIndex].label"></p>
          <p class="mt-1 text-sm" style="color:var(--muted)" x-text="STATUSES[statusIndex].detail"></p>
          <div class="h-1.5 max-w-sm mx-auto mt-6 rounded-full overflow-hidden" style="background:var(--navy-mid)">
            <div class="status-progress h-full rounded-full" style="background:var(--green)"></div>
          </div>
          <p class="mt-3 text-xs" style="color:var(--muted)">Writing the full report: neighborhood, market and next steps</p>
          <p class="mt-2 max-w-md mx-auto text-xs leading-relaxed" style="color:var(--muted)">This may take up to 2 minutes. The numbers above are final; this adds the written sections.</p>
        </div>
              </div>
            </template>
            <button x-show="!writeupBusy" class="btn" @click="runWriteup(report)">Generate full report · included</button>
            <p x-show="writeupError" class="text-sm mt-2" style="color:var(--red)" x-text="writeupError"></p>
          </div>
        </template>
      </section>

      <!-- Holding costs & vacancy -->
      <section class="card rounded-xl p-5 space-y-3">
        <h2 class="font-semibold">Holding costs &amp; vacancy</h2>
        <p x-show="report.analysis.vacancy.months_vacant!=null" class="text-sm muted" x-text="'Vacant ' + report.analysis.vacancy.months_vacant + ' months (since ' + (report.inputs.vacant_since||'—') + ')'"></p>
        <div class="overflow-x-auto">
          <table class="tbl">
            <tbody>
              <template x-for="row in holdingRows(report)" :key="row.k">
                <tr>
                  <td x-text="row.label"></td>
                  <td class="num" x-text="money1((report.analysis.vacancy.monthly_breakdown||{})[row.k])"></td>
                </tr>
              </template>
              <tr style="border-top:1px solid var(--border);font-weight:700">
                <td>Total monthly</td>
                <td class="num" x-text="money1(report.analysis.vacancy.monthly_carry)"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="text-sm space-y-1">
          <div class="flex justify-between"><span class="muted">Carrying cost since vacant</span><span x-text="money(report.analysis.vacancy.carry_since_vacant)"></span></div>
          <div class="flex justify-between" x-show="report.analysis.vacancy.cost_basis_entered!=null"><span class="muted">Cost basis you entered</span><span x-text="money(report.analysis.vacancy.cost_basis_entered)"></span></div>
          <div class="flex justify-between" x-show="report.analysis.vacancy.cost_basis_entered!=null"><span class="muted">Adjusted cost basis (incl. carrying since vacant)</span><span x-text="money(report.analysis.vacancy.cost_basis_adjusted)"></span></div>
        </div>
      </section>

      <details class="card rounded-xl p-4">
        <summary class="font-semibold cursor-pointer">Property inputs &amp; sources</summary>
        <p class="help mt-1">USER = your spreadsheet or edits · DATA = market research · DEFAULT = standard assumption, lowers confidence</p>
        <div class="overflow-x-auto mt-3">
          <table class="tbl">
            <thead><tr><th scope="col">Input</th><th scope="col" class="num">Value</th><th scope="col">Source</th><th scope="col">Detail</th></tr></thead>
            <tbody>
              <template x-for="a in propertyInputs(report)" :key="a.name">
                <tr><td x-text="a.name.replaceAll('_',' ')"></td><td class="num" x-text="a.value==null?'—':(typeof a.value==='number'?a.value.toLocaleString():a.value)"></td>
                  <td><span class="chip" :class="a.source==='USER'?'chip-green':(a.source==='DATA'?'chip-gold':'')" x-text="a.source"></span></td>
                  <td class="text-xs muted" x-text="a.source_detail||''"></td></tr>
              </template>
            </tbody>
          </table>
        </div>
      </details>

      <details class="card rounded-xl p-4">
        <summary class="font-semibold cursor-pointer">Batch assumptions used</summary>
        <div class="grid sm:grid-cols-3 gap-x-6 gap-y-1 mt-3 text-xs">
          <template x-for="a in batchAssumptions(report)" :key="a.name">
            <div class="flex justify-between gap-2 border-b py-1" style="border-color:rgba(64,86,113,.5)"><span class="muted" x-text="a.name.replaceAll('_',' ')"></span><span x-text="typeof a.value==='number'?a.value.toLocaleString():a.value"></span></div>
          </template>
        </div>
      </details>

      <p class="text-xs muted">This analysis is an investment model, not legal or tax advice. Confirm the tax impact with your CPA and land contract terms with a Michigan real estate attorney.</p>
    </div>
  </template>
</main>

<!-- Edit drawer (D5) -->
<template x-if="drawer">
  <div>
    <div class="scrim" @click="drawer=null"></div>
    <aside class="drawer card p-5 space-y-4" role="dialog" aria-modal="true" aria-label="Edit property inputs" @keydown.escape.window="drawer=null" x-init="$nextTick(()=>$el.querySelector('input')?.focus())">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold" x-text="drawer.row.inputs.address_line"></h2>
        <button class="btn" @click="drawer=null" aria-label="Close">✕</button>
      </div>
      <p class="help">Blank = use the spreadsheet value or market estimate. Changes on finished rows apply with Recalculate (free).</p>
      <template x-for="f in DRAWER_FIELDS" :key="f.key">
        <div>
          <label class="f" x-text="f.label"></label>
          <input class="w-full" type="number" step="any" x-model="drawer.values[f.key]" :placeholder="drawerPlaceholder(f.key)">
          <p x-show="f.help" class="help" x-text="f.help"></p>
        </div>
      </template>
      <p x-show="drawer.error" class="text-sm" style="color:var(--red)" x-text="drawer.error"></p>
      <div class="flex gap-2"><button class="btn btn-primary" @click="saveDrawer()">Save</button><button class="btn" @click="drawer=null">Cancel</button></div>
    </aside>
  </div>
</template>

<!-- Report edit drawer: owner edits this property's numbers & assumptions, rerun free -->
<template x-if="reportEdit">
  <div>
    <div class="scrim" @click="reportEdit=null"></div>
    <aside class="drawer card p-5 space-y-4" role="dialog" aria-modal="true" aria-label="Edit this property's numbers" @keydown.escape.window="reportEdit=null" x-init="$nextTick(()=>$el.querySelector('input')?.focus())">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold">Edit this property's numbers</h2>
        <button class="btn" @click="reportEdit=null" aria-label="Close">✕</button>
      </div>
      <p class="help">Only the financial numbers are recalculated. Market data, comps and the written sections are not re-researched. No tokens are used.</p>

      <fieldset class="space-y-3">
        <legend class="text-xs font-semibold mb-2" style="color:var(--gold-light)">Property numbers</legend>
        <template x-for="f in REPORT_PROP_FIELDS" :key="f.key">
          <div>
            <label class="f">
              <span x-text="f.label"></span>
              <span class="chip ml-1" :class="assumSource(f.key)==='USER'?'chip-green':(assumSource(f.key)==='DATA'?'chip-gold':'')" x-show="assumSource(f.key)" x-text="assumSource(f.key)"></span>
            </label>
            <input class="w-full" type="number" step="any" x-model="reportEdit.prop[f.key]">
          </div>
        </template>
      </fieldset>

      <fieldset class="space-y-3">
        <legend class="text-xs font-semibold mb-2" style="color:var(--gold-light)">Assumptions</legend>
        <template x-for="f in REPORT_ASSUMPTION_FIELDS" :key="f.key">
          <div>
            <label class="f" :style="isRowAssumEdited(f.key)&&'color:var(--text);font-weight:700'">
              <span x-text="f.label"></span>
              <span class="chip chip-gold ml-1" x-show="isRowAssumEdited(f.key)">edited</span>
            </label>
            <template x-if="f.key==='owner_goal'">
              <select class="w-full" x-model="reportEdit.assum.owner_goal">
                <option value="">None</option>
                <option value="maximize_cash_now">Cash now</option>
                <option value="maximize_total_return">Total return</option>
                <option value="monthly_income">Monthly income</option>
                <option value="minimize_effort">Least effort</option>
              </select>
            </template>
            <template x-if="f.key!=='owner_goal'">
              <input class="w-full" type="number" step="any" x-model="reportEdit.assum[f.key]">
            </template>
          </div>
        </template>
      </fieldset>

      <p x-show="reportEdit.error" class="text-sm" style="color:var(--red)" x-text="reportEdit.error"></p>
      <div class="flex flex-wrap gap-2">
        <button class="btn btn-primary" :disabled="reportEdit.busy" @click="rerunReportEdit()" x-text="reportEdit.busy ? 'Recalculating…' : 'Rerun · free'"></button>
        <button class="btn" :disabled="reportEdit.busy" @click="resetReportAssumptions()">Reset assumptions to batch</button>
        <button class="btn" @click="reportEdit=null">Cancel</button>
      </div>
    </aside>
  </div>
</template>

<!-- Start dialog when statements are unconfirmed (N-design D4) -->
<template x-if="startDialog">
  <div>
    <div class="scrim" @click="startDialog=false"></div>
    <div class="fixed inset-0 z-[70] flex items-center justify-center p-4" role="dialog" aria-modal="true">
      <div class="card rounded-xl p-5 max-w-md space-y-3" @keydown.escape.window="startDialog=false">
        <p class="font-semibold" x-text="batch.unconfirmed_statements + ' loan statements are unconfirmed'"></p>
        <p class="text-sm muted">Unconfirmed statements are not used. Those properties run on the spreadsheet loan value, or $0.</p>
        <div class="flex gap-2 justify-end">
          <button class="btn" @click="startDialog=false">Confirm first</button>
          <button class="btn btn-primary" @click="startDialog=false; startQueue()">Run without them</button>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
const _slug = location.pathname.split('/').filter(Boolean)[0] || '';
const LABELS = { sell_as_is: 'Sell as-is', rehab_sell: 'Rehab & sell', rehab_rent: 'Rehab & rent', rehab_land_contract: 'Land contract' };
const LANES = 2;

function safeCell(v) {
  // E11: neutralize spreadsheet formulas in exported text
  if (typeof v !== 'string') return v;
  return /^[=+\-@\t\r]/.test(v) ? "'" + v : v;
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function portfolio() {
  return {
    slug: _slug, token: null, me: null, tenantName: '', error: '', liveMessage: '',
    view: 'home', homeTab: 'upload', batches: [], batch: null, report: null, unmatchedLoans: [],
    invFile: null, loansFile: null, dragOver: false, uploading: false, uploadError: '', uploadMissing: [],
    single: {}, singleBusy: false, singleError: '',
    showAssumptions: false, assumptionDraft: {}, assumptionError: '', recalcBusy: false,
    filterExit: '', filterPortfolio: '', filterFlag: '',
    queueRunning: false, stopRequested: false, waitingTokens: false, rowTimes: [], retrying: false, wakeLock: null,
    stmtBusy: false, stmtProgress: '', stmtEdits: {},
    drawer: null, startDialog: false,
    writeupBusy: false, writeupText: '', writeupError: '',
    lcForm: { sale_price: '', down_pct: '', rate_pct: '', term_years: '', default_prob_pct: '' }, lcBusy: false, lcError: '', lcTimer: null, lcSeq: 0,
    reportEdit: null,
    statusIndex: 0, statusTimer: null,
    STATUSES: [
      { label: 'Connecting to market data', detail: 'Gathering current property and neighborhood information' },
      { label: 'Pulling in property information', detail: 'Reviewing public records, listings, and comparable sales' },
      { label: 'Building the financial picture', detail: 'Calculating holding costs, payoffs, and net cash for each exit' },
      { label: 'Reading public data', detail: 'Checking schools, amenities, trends, and local conditions' },
      { label: 'Making exit suggestions', detail: 'Comparing sell as-is, rehab & sell, rehab & rent, and land contract' },
    ],
    STRATS: ['sell_as_is', 'rehab_sell', 'rehab_rent', 'rehab_land_contract'],
    METRICS: [
      { key: 'risk_adjusted_score', label: 'Risk-adjusted value', fmt: 'money', bold: true },
      { key: 'npv', label: 'NPV', fmt: 'money' },
      { key: 'net_profit', label: 'Net profit', fmt: 'money' },
      { key: 'irr', label: 'IRR', fmt: 'pct' },
      { key: 'equity_multiple', label: 'Equity multiple', fmt: 'x' },
      { key: 'peak_capital', label: 'Peak capital', fmt: 'money' },
      { key: 'months_to_liquidity', label: 'Months to liquidity', fmt: 'months' },
      { key: 'effort', label: 'Effort', fmt: 'text' },
      { key: 'risk_score', label: 'Risk score (1-10)', fmt: 'num' },
    ],
    STRESS: [
      { key: 'base', label: 'Base case' }, { key: 'rehab_overrun', label: 'Rehab +20%' },
      { key: 'arv_minus_10', label: 'ARV −10%' }, { key: 'zero_appreciation', label: '0% appreciation' },
      { key: 'rental_stress', label: 'Rent −10%, vacancy 15%' }, { key: 'lc_default_40', label: 'LC default 40%' },
      { key: 'combined_downside', label: 'Combined downside' },
    ],
    DRAWER_FIELDS: [
      { key: 'loan_payoff', label: 'Loan payoff (release amount)', help: 'A payoff above $0 needs the rate and P&I' },
      { key: 'loan_rate_pct', label: 'Loan interest rate %' },
      { key: 'loan_pi', label: 'Loan monthly P&I' },
      { key: 'investor_payback', label: 'Investor payback', help: 'Fixed amount owed to investors at sale or when a land contract is paid off or sold' },
      { key: 'cost_basis', label: 'Cost basis', help: 'Purchase + improvements + carrying costs to date' },
      { key: 'as_is_value', label: 'Current value (as-is)', help: 'Blank → estimated from similar-condition sales' },
      { key: 'arv', label: 'After-repair value (ARV)' },
      { key: 'market_rent', label: 'Market rent / month' },
      { key: 'rehab_budget', label: 'Rehab budget' },
      { key: 'annual_tax', label: 'Annual property tax' },
      { key: 'annual_insurance', label: 'Annual insurance' },
    ],
    assumptionGroups: [
      { title: 'Ranking', help: 'Discount rate: what a dollar a year from now is worth to you today. Higher favors faster exits.',
        fields: [{ key: 'discount_rate_pct', label: 'Discount rate %' }, { key: 'owner_goal', label: 'Tie-breaker goal' }, { key: 'horizon_months', label: 'Horizon (months)' }] },
      { title: 'Carrying costs', fields: [{ key: 'insurance_default_annual', label: 'Insurance default $/yr' }, { key: 'utilities_vacant_monthly', label: 'Vacant utilities $/mo' }] },
      { title: 'Selling', fields: [{ key: 'commission_pct', label: 'Commission %' }, { key: 'closing_pct', label: 'Closing + transfer tax %' }, { key: 'as_is_commission_pct', label: 'As-is commission %' }, { key: 'concessions_pct', label: 'Concessions %' }] },
